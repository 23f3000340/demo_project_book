version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  web:
    build: .
    command: gunicorn bookstore_project.wsgi:application -w 2 -b 0.0.0.0:8000
    volumes:
      - .:/app:cached
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: '1'
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
